name: Demo V2 build and browser acceptance
on:
  push:
    branches: [demov2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-demov2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm unchanged renderer and game engine
        run: git diff --exit-code 8ea936a258c4df0b31cc5d306f600213634d41c1 -- src scripts
      - name: Install build and browser dependencies
        run: python -m pip install -r scripts/requirements-landscape.txt playwright==1.58.0
      - name: Existing canonical unit tests
        run: |
          node --test tests/test_math.cjs tests/test_i18n.cjs tests/test_reactions.cjs tests/test_animation.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build the illustrated asset pack
        run: python scripts/build_city.py --city tokyo-demo --output dist/SnackDash_DemoV2.html --zip
      - name: Browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Actual Demo V2 gameplay and animation acceptance
        run: python tests/demov2_smoke.py
      - name: Rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DemoV2-rendered-evidence
          path: dist/demov2-evidence/
          if-no-files-found: warn
      - name: Validated playable demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DemoV2-playable
          path: |
            dist/SnackDash_DemoV2.html
            dist/SnackDash_DemoV2.zip
          if-no-files-found: error
