name: Landscape Engine V2 validation
on:
  push:
    branches: [feature/tokyo-landscape-playtest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and test dependencies
        run: python -m pip install -r scripts/requirements-landscape.txt playwright==1.58.0
      - name: Syntax and canonical unit tests
        run: |
          node --check src/js/i18n.js
          node --check src/js/math.js
          node --check src/js/game.js
          node --check src/landscape/animation.js
          node --check src/landscape/hud.js
          node --check src/landscape/audio.js
          node --check src/landscape/renderer.js
          node --check src/landscape/presentation.js
          node --test tests/test_math.cjs tests/test_i18n.cjs tests/test_reactions.cjs tests/test_animation.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build canonical game and both landscape packs
        run: |
          python scripts/build.py --zip
          python scripts/build_tokyo.py --zip
          python scripts/build_city.py --city qa-london --zip
      - name: Browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Cross-pack runtime and deterministic replay
        run: python tests/landscape_asset_smoke.py
      - name: Tokyo browser acceptance
        if: always()
        run: python tests/tokyo_smoke.py
      - name: Regular game regression
        if: always()
        run: python tests/smoke.py
      - name: Technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-contract-evidence
          path: |
            dist/landscape-contract
            dist/tokyo-review
          if-no-files-found: warn
      - name: Validated technical preview builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-contract-technical-builds
          path: |
            dist/Snack_Dash_Tokyo_Preview.html
            dist/Snack_Dash_Tokyo_Preview.zip
            dist/Snack_Dash_qa-london_Preview.html
            dist/Snack_Dash_qa-london_Preview.zip
          if-no-files-found: error
