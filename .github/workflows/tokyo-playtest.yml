name: Tokyo playtest validation
on:
  push:
    branches: [feature/tokyo-landscape-playtest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-tokyo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source artwork for visual review and asset extraction
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-R01-Source-Art
          path: assets/previews/character-r01/originals
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and canonical unit tests
        run: |
          node --check src/js/i18n.js
          node --check src/js/locales.js
          node --check src/js/math.js
          node --check src/js/reactions.js
          node --check src/js/game.js
          node --check src/tokyo/art.js
          node --check src/tokyo/preview.js
          node --test tests/test_math.cjs tests/test_i18n.cjs tests/test_reactions.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build both offline games
        run: |
          python scripts/build.py --zip
          python scripts/build_tokyo.py --zip
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Tokyo browser acceptance and screenshots
        run: python tests/tokyo_smoke.py
      - name: Regular game regression
        if: always()
        run: python tests/smoke.py
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-review-evidence
          path: dist/tokyo-review
          if-no-files-found: warn
      - name: Validated offline Tokyo playtest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnackDash-Tokyo-Playtest
          path: |
            dist/Snack_Dash_Tokyo_Preview.html
            dist/Snack_Dash_Tokyo_Preview.zip
          if-no-files-found: error
