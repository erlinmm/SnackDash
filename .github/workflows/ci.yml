name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          node --check src/js/math.js
          node --check src/js/game.js
      - name: Run mathematical and build unit tests
        run: |
          node --test tests/test_math.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build offline HTML and ZIP
        run: python scripts/build.py --zip
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Mobile browser smoke tests
        run: python tests/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnackDash-HTML
          path: |
            dist/Snack_Dash.html
            dist/Snack_Dash_HTML.zip
          if-no-files-found: error
