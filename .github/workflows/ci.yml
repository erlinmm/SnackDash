name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          node --check src/js/i18n.js
          node --check src/js/locales.js
          node --check src/js/math.js
          node --check src/js/reactions.js
          node --check src/js/game.js
          bash -n scripts/publish_release.sh
      - name: Run mathematical and build unit tests
        run: |
          node --test tests/test_math.cjs tests/test_i18n.cjs tests/test_reactions.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build offline HTML and ZIP
        run: python scripts/build.py --zip
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Mobile browser smoke tests
        run: python tests/smoke.py
      - name: Build and test installable PWA
        run: |
          python scripts/build_pwa.py dist/Snack_Dash.html site
          node --check site/sw.js
          node --check src/pwa/update.js
          python tests/pwa_smoke.py
          python tests/pwa_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnackDash-HTML
          path: |
            dist/Snack_Dash.html
            dist/Snack_Dash_HTML.zip
          if-no-files-found: error

  # Post a mobile-friendly downloadable build ONLY after the full CI job
  # passes. Every main-branch run receives a unique build-N tag and prerelease.
  # Stable v* releases remain under the separate manual publishing pipeline.
  publish-mobile-build:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SnackDash-HTML
          path: dist
      - name: Publish mobile download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
          AUTO_BUILD_RELEASE: 'true'
        shell: bash
        run: |
          bash -n scripts/publish_release.sh
          bash scripts/publish_release.sh

  deploy-pages:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SnackDash-HTML
          path: dist
      - name: Prepare website
        run: python scripts/build_pwa.py dist/Snack_Dash.html site
      - uses: actions/configure-pages@v5
      # GitHub retains artifacts across re-runs of the same workflow run.
      # Include both the run ID and attempt so retries never share a name.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Wait until Pages artifact is visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The deployment API can query the artifact before its metadata
          # propagates. Poll this run rather than retrying a failed deploy.
          for attempt in {1..12}; do
            if response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"; then
              count="$(printf '%s' "$response" | jq --arg name "$PAGES_ARTIFACT" '[.artifacts[] | select(.name == $name)] | length')"
              if [[ "$count" == "1" ]]; then
                echo "Pages artifact ready: $PAGES_ARTIFACT"
                exit 0
              fi
              if [[ "$count" -gt 1 ]]; then
                echo "::error::Multiple artifacts named $PAGES_ARTIFACT"
                exit 1
              fi
            else
              echo "::warning::Artifact metadata query failed (attempt $attempt)"
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT was not visible"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
