name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (digits only): use 1.0, NOT 1.p. Default creates v1.0.0'
        required: true
        default: '1.0'
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Normalize and validate release version
        shell: bash
        run: |
          input="${RELEASE_TAG#v}"
          if [[ "$input" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-([0-9A-Za-z][0-9A-Za-z.-]*))?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[4]:-0}"
            suffix="${BASH_REMATCH[5]}"
            normalized="v${major}.${minor}.${patch}${suffix}"
          else
            echo "::error::Invalid version '$RELEASE_TAG'. The version must contain digits, e.g. 1.0 (zero), not 1.p (letter p). Use 1.0 or 1.0.1."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$RELEASE_TAG" != "$normalized" ]]; then
            echo "::error::Git tags must use the full format '$normalized'"
            exit 1
          fi
          echo "RELEASE_TAG=$normalized" >> "$GITHUB_ENV"
          echo "Release version: $normalized"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test and build
        run: |
          node --check src/js/math.js
          node --check src/js/game.js
          node --test tests/test_math.cjs
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py --zip
      - name: Browser smoke tests
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/smoke.py
      - name: Publish versioned downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY"
                --title "Snack Dash $RELEASE_TAG"
                --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            # A manual run creates a new release tag at the selected commit.
            # Existing versions are never moved or silently overwritten.
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            dist/Snack_Dash.html dist/Snack_Dash_HTML.zip "${args[@]}"
